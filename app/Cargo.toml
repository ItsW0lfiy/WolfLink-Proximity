[package]
name = "wolflink-app"
version = "0.1.0-alpha.2"
edition = "2024"

[[bin]]
name = "WolfLink"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wolflink-relay = { path = "../relay" }
wolflink-update = { path = "../update" }
semver = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
